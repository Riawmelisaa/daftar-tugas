<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Tugas Kuliah | Ria Melisa</title>
  <meta name="description" content="Aplikasi web sederhana untuk mengelola daftar tugas kuliah, dibuat dengan TypeScript dan Vite.">
  <meta name="theme-color" content="#2b4573">
  <meta property="og:title" content="Daftar Tugas Kuliah | Ria Melisa">
  <meta property="og:description" content="Tambah, edit, hapus, dan pantau status tugas kuliah.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
</head>
<body>
  <a class="skip-link" href="#daftar">Lewati ke daftar tugas</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <h1 class="brand"><span id="app-name">Daftar Tugas Kuliah</span></h1>
      <span class="version" id="app-version">v1.0.0</span>
    </div>
  </header>

  <main class="wrap">
    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">Tambah Tugas Baru</h2>
      <form id="task-form" class="form">
        <div class="field field--wide">
          <label for="task-title">Judul tugas</label>
          <input id="task-title" type="text" required maxlength="120" placeholder="Contoh: Laporan praktikum jaringan">
        </div>
        <div class="field">
          <label for="task-course">Mata kuliah</label>
          <select id="task-course" required></select>
        </div>
        <div class="field">
          <label for="task-deadline">Tenggat</label>
          <input id="task-deadline" type="date" required>
        </div>
        <div class="field field--wide">
          <label for="task-note">Catatan (opsional)</label>
          <textarea id="task-note" rows="2" maxlength="240" placeholder="Tuliskan detail singkat bila perlu"></textarea>
        </div>
        <div class="form__actions">
          <button type="submit" id="submit-btn" class="btn btn--primary">Tambah Tugas</button>
          <button type="button" id="cancel-btn" class="btn btn--ghost" hidden>Batal</button>
        </div>
      </form>
    </section>

    <section id="daftar" class="card" aria-labelledby="judul-daftar">
      <div class="list-head">
        <h2 id="judul-daftar">Daftar Tugas</h2>
        <div class="filters" role="group" aria-label="Filter status tugas">
          <button type="button" class="chip" data-filter="semua" aria-pressed="true">Semua</button>
          <button type="button" class="chip" data-filter="belum" aria-pressed="false">Belum Selesai</button>
          <button type="button" class="chip" data-filter="selesai" aria-pressed="false">Selesai</button>
        </div>
      </div>
      <p id="summary" class="summary" aria-live="polite"></p>
      <ul id="task-list" class="task-list"></ul>
      <p id="empty-state" class="empty" hidden></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; 2026 Ria Melisa. Dibuat dengan TypeScript dan Vite.</p>
    </div>
  </footer>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
